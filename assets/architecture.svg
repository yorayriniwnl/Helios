<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-labelledby="title desc">
  <title id="title">Helios system architecture</title>
  <desc id="desc">The implemented Helios path from meter input to the operator dashboard.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#000"/><stop offset=".5" stop-color="#160303"/><stop offset="1" stop-color="#050505"/></linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#671515"/><stop offset=".5" stop-color="#e84b4b"/><stop offset="1" stop-color="#ff8a7f"/></linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#f5eaea" stroke-opacity=".06"/></pattern>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="#ff8a7f"/></marker>
  </defs>
  <rect width="1400" height="720" fill="url(#bg)"/>
  <rect width="1400" height="720" fill="url(#grid)"/>
  <path d="M64 74H280" stroke="#e84b4b" stroke-width="4"/>
  <text x="64" y="116" fill="#f5eaea" font-family="Georgia,serif" font-size="42">Helios / signal path</text>
  <text x="66" y="150" fill="#c4c4c4" font-family="monospace" font-size="13" letter-spacing="2">IMPLEMENTED BOUNDARIES // VERIFIED AGAINST PUBLIC SOURCE</text>
  <g font-family="monospace">
    <g transform="translate(70 270)"><rect width="190" height="128" rx="7" fill="#050505" stroke="#e84b4b" stroke-opacity=".7"/><text x="22" y="38" fill="#ff8a7f" font-size="12" letter-spacing="2">01 // INPUT</text><text x="22" y="75" fill="#f5eaea" font-size="20">Meter readings</text><text x="22" y="101" fill="#c4c4c4" font-size="12">REST / simulator</text></g>
    <g transform="translate(330 270)"><rect width="210" height="128" rx="7" fill="#050505" stroke="#e84b4b" stroke-opacity=".7"/><text x="22" y="38" fill="#ff8a7f" font-size="12" letter-spacing="2">02 // INGEST</text><text x="22" y="75" fill="#f5eaea" font-size="20">FastAPI</text><text x="22" y="101" fill="#c4c4c4" font-size="12">/api/v1 routes</text></g>
    <g transform="translate(610 270)"><rect width="210" height="128" rx="7" fill="#050505" stroke="#e84b4b" stroke-opacity=".7"/><text x="22" y="38" fill="#ff8a7f" font-size="12" letter-spacing="2">03 // DETECT</text><text x="22" y="75" fill="#f5eaea" font-size="20">Rules + ML hook</text><text x="22" y="101" fill="#c4c4c4" font-size="12">anomaly scoring</text></g>
    <g transform="translate(890 270)"><rect width="210" height="128" rx="7" fill="#050505" stroke="#e84b4b" stroke-opacity=".7"/><text x="22" y="38" fill="#ff8a7f" font-size="12" letter-spacing="2">04 // STORE</text><text x="22" y="75" fill="#f5eaea" font-size="20">Postgres / SQLite</text><text x="22" y="101" fill="#c4c4c4" font-size="12">SQLAlchemy models</text></g>
    <g transform="translate(1170 270)"><rect width="170" height="128" rx="7" fill="#671515" stroke="#ff8a7f" stroke-opacity=".8"/><text x="22" y="38" fill="#f5eaea" font-size="12" letter-spacing="2">05 // SURFACE</text><text x="22" y="75" fill="#f5eaea" font-size="20">Next.js UI</text><text x="22" y="101" fill="#f5eaea" font-size="12">REST + /ws/live</text></g>
  </g>
  <g stroke="url(#line)" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M260 334H326"/><path d="M540 334H606"/><path d="M820 334H886"/><path d="M1100 334H1166"/>
  </g>
  <g transform="translate(70 500)" font-family="monospace">
    <rect width="1270" height="112" rx="7" fill="#000" fill-opacity=".55" stroke="#f5eaea" stroke-opacity=".12"/>
    <text x="26" y="34" fill="#e84b4b" font-size="12" letter-spacing="2">REALTIME CHANNELS</text>
    <text x="26" y="68" fill="#f5eaea" font-size="16">WebSocket broadcasts readings, alerts, and anomalies to the shared client listener.</text>
    <text x="26" y="92" fill="#c4c4c4" font-size="12">Demo mode emits deterministic local frames; providers remain explicitly fail-closed when not configured.</text>
  </g>
  <text x="1340" y="680" text-anchor="end" fill="#c4c4c4" font-family="monospace" font-size="11" letter-spacing="2">HELIOS // ARCHITECTURE NOTE // NOT A DEPLOYMENT CLAIM</text>
</svg>
