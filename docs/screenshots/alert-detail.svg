<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc">
  <title id="title">Helios alert detail preview</title><desc id="desc">A code-authored alert detail and evidence preview for the Helios command surface.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#000"/><stop offset="1" stop-color="#160303"/></linearGradient><linearGradient id="signal" x1="0" x2="1"><stop stop-color="#671515"/><stop offset="1" stop-color="#ff8a7f"/></linearGradient></defs>
  <rect width="1000" height="600" fill="url(#bg)"/><rect x="28" y="28" width="944" height="544" rx="7" fill="#050505" stroke="#f5eaea" stroke-opacity=".17"/>
  <text x="60" y="76" fill="#c4c4c4" font-family="monospace" font-size="11" letter-spacing="3">HELIOS // CASE DETAIL // SAMPLE</text><text x="60" y="122" fill="#f5eaea" font-family="Georgia,serif" font-size="34">High-power anomaly</text><text x="60" y="151" fill="#c4c4c4" font-family="monospace" font-size="12">METER M-104  ·  ZONE E  ·  SCORE 0.82  ·  OPEN</text>
  <g transform="translate(60 190)"><rect width="270" height="172" rx="6" fill="#671515" fill-opacity=".58" stroke="#e84b4b" stroke-opacity=".6"/><text x="20" y="34" fill="#ff8a7f" font-family="monospace" font-size="11" letter-spacing="2">DECISION CONTEXT</text><text x="20" y="70" fill="#f5eaea" font-family="Georgia,serif" font-size="22">Transformer stress</text><text x="20" y="103" fill="#c4c4c4" font-family="Inter,Arial" font-size="12">Inspect the asset and compare</text><text x="20" y="121" fill="#c4c4c4" font-family="Inter,Arial" font-size="12">neighboring meter traces.</text><text x="20" y="151" fill="#ff8a7f" font-family="monospace" font-size="10">REPORTED / NOT PROVEN</text></g>
  <g transform="translate(350 190)"><rect width="270" height="172" rx="6" fill="#050505" stroke="#f5eaea" stroke-opacity=".14"/><text x="20" y="34" fill="#c4c4c4" font-family="monospace" font-size="11" letter-spacing="2">RESPONSE PATH</text><text x="20" y="70" fill="#f5eaea" font-family="Georgia,serif" font-size="22">Assign inspector</text><text x="20" y="103" fill="#c4c4c4" font-family="Inter,Arial" font-size="12">1. Verify the reading</text><text x="20" y="123" fill="#c4c4c4" font-family="Inter,Arial" font-size="12">2. Attach field evidence</text><rect x="20" y="140" width="128" height="22" rx="11" fill="url(#signal)"/><text x="84" y="155" text-anchor="middle" fill="#000" font-family="monospace" font-size="10">ASSIGN →</text></g>
  <g transform="translate(640 190)"><rect width="300" height="172" rx="6" fill="#050505" stroke="#f5eaea" stroke-opacity=".14"/><text x="20" y="34" fill="#c4c4c4" font-family="monospace" font-size="11" letter-spacing="2">EVIDENCE STATUS</text><text x="20" y="75" fill="#ff8a7f" font-family="Georgia,serif" font-size="26">Awaiting capture</text><text x="20" y="111" fill="#c4c4c4" font-family="Inter,Arial" font-size="12">Photos, notes, timestamp, and GPS</text><text x="20" y="130" fill="#c4c4c4" font-family="Inter,Arial" font-size="12">remain attached to the case.</text><text x="20" y="157" fill="#c4c4c4" font-family="monospace" font-size="10">DEMO FLOW AVAILABLE</text></g>
  <g transform="translate(60 396)"><rect width="880" height="112" rx="6" fill="#050505" stroke="#f5eaea" stroke-opacity=".14"/><text x="20" y="32" fill="#f5eaea" font-family="Georgia,serif" font-size="20">Reading history</text><path d="M20 85 120 74 220 82 320 45 420 62 520 28 620 54 720 22 860 40" fill="none" stroke="url(#signal)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="720" cy="22" r="5" fill="#ff8a7f"/></g>
  <text x="60" y="548" fill="#c4c4c4" font-family="monospace" font-size="10" letter-spacing="1">CODE-AUTHORED UI PREVIEW // SYNTHETIC VALUES // DETECTION IS NOT PROOF OF FAULT</text>
</svg>
