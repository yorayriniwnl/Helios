<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc">
  <title id="title">Helios alert triage preview</title><desc id="desc">A code-authored YOR-styled alert queue showing semantic severity and response actions.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#000"/><stop offset="1" stop-color="#160303"/></linearGradient></defs>
  <rect width="1000" height="500" fill="url(#bg)"/><rect x="26" y="26" width="948" height="448" rx="7" fill="#050505" stroke="#f5eaea" stroke-opacity=".17"/>
  <text x="60" y="76" fill="#c4c4c4" font-family="monospace" font-size="11" letter-spacing="3">HELIOS // ALERT TRIAGE</text><text x="60" y="122" fill="#f5eaea" font-family="Georgia,serif" font-size="34">Move from signal to action</text><text x="60" y="150" fill="#c4c4c4" font-family="Inter,Arial" font-size="13">Synthetic demo composition — response states are illustrative.</text>
  <g font-family="monospace" font-size="10"><rect x="60" y="184" width="880" height="58" rx="5" fill="#671515" fill-opacity=".58" stroke="#e84b4b" stroke-opacity=".65"/><text x="82" y="208" fill="#ff8a7f" letter-spacing="1">CRITICAL  //  OPEN</text><text x="82" y="227" fill="#f5eaea" font-family="Inter,Arial" font-size="12">Meter M-104 · high-power anomaly · explanation available</text><text x="820" y="218" fill="#f5eaea">ASSIGN →</text>
  <rect x="60" y="256" width="880" height="58" rx="5" fill="#f5eaea" fill-opacity=".045" stroke="#f5eaea" stroke-opacity=".12"/><text x="82" y="280" fill="#ff8a7f" letter-spacing="1">HIGH  //  ASSIGNED</text><text x="82" y="299" fill="#f5eaea" font-family="Inter,Arial" font-size="12">Meter M-117 · sustained drift · inspector context attached</text><text x="820" y="290" fill="#c4c4c4">OPEN →</text>
  <rect x="60" y="328" width="880" height="58" rx="5" fill="#f5eaea" fill-opacity=".025" stroke="#f5eaea" stroke-opacity=".12"/><text x="82" y="352" fill="#c4c4c4" letter-spacing="1">MEDIUM  //  RESOLVED</text><text x="82" y="371" fill="#f5eaea" font-family="Inter,Arial" font-size="12">Meter M-109 · voltage variance · resolution note recorded</text><text x="820" y="362" fill="#c4c4c4">VIEW →</text></g>
  <text x="60" y="436" fill="#c4c4c4" font-family="monospace" font-size="10" letter-spacing="1">REST SNAPSHOT + WEBSOCKET LISTENER // STATUS COLORS CARRY SEMANTIC MEANING</text>
</svg>
